name: cosmos-api-dev

services:
  cosmos-api-service:
    container_name: cosmos-api-dev
    # Build from local source instead of pulling production image
    build:
      context: .
      dockerfile: Dockerfile.dev
    # Force a quick check/install on startup to ensure tsx is always found
    command: sh -c "pnpm install && pnpm dev"
    # Re-adding the port override (3001) so you can reach it from your Mac!
    ports:
      - "3001:3000"
    # Mac Optimization: volume mounts with black-holed node_modules
    volumes:
      - .:/app:delegated
      - /app/node_modules
      - /app/dist
      - /app/.git
    # Hot-reloading via Docker Compose Watch
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          ignore:
            - node_modules/
            - dist/
            - .git/
    env_file: .env.dev
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    stdin_open: true
    tty: true

  # 2. Database Port Override: Change local port to 5434 if 5433 is occupied
  cosmos-db-service:
    container_name: cosmos-db-dev
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d Roadmap"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. Redis Port Override: Change local port to 6381 if 6380 is occupied
  cosmos-redis-service:
    container_name: cosmos-redis-dev
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 4. Proxy Port Override: Change local port to 8091 if 8090 is occupied
  cosmos-proxy:
    container_name: cosmos-proxy-dev
    ports:
      - "8091:80"
