# docker-compose.dev.yml - STANDALONE DEV STACK
name: cosmos-api-dev

services:
  # 1. THE API - Development Mode
  cosmos-api-dev:
    container_name: cosmos-api-dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: sh -c "pnpm install --no-frozen-lockfile && pnpm db:migrate && pnpm exec tsx --watch --inspect=0.0.0.0:9229 index.ts"
    ports:
      - "3001:3000"
      - "9229:9229"
    volumes:
      - .:/app:delegated
      - /app/node_modules
      - /app/dist
      - /app/.git
      - /app/.env # "Black-holes" the prod .env so it doesn't override Dev
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          ignore:
            - node_modules/
            - dist/
            - .git/
    env_file: .env.dev
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - CI=true # Prevents pnpm from asking interactive questions
    networks:
      - backend-nw
    # FIXED: Service names now match
    depends_on:
      cosmos-db-dev:
        condition: service_healthy
      cosmos-redis-dev:
        condition: service_healthy
    stdin_open: true
    tty: true

  # 2. THE DATABASE - Isolated Data
  cosmos-db-dev:
    container_name: cosmos-db-dev
    image: postgres:alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: Roadmap
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d Roadmap"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    networks:
      - backend-nw

  # 3. THE CACHE - Isolated for Dev
  cosmos-redis-dev:
    container_name: cosmos-redis-dev
    image: redis:alpine
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "6381:6379"
    networks:
      - backend-nw

networks:
  backend-nw:
    driver: bridge

volumes:
  # Separate data island
  postgres_dev_data:
