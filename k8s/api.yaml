apiVersion: v1
kind: Service
metadata:
  name: cosmos-api-service
  namespace: cosmos-app
spec:
  type: LoadBalancer # 🚥 Perfectly aligns with your Cloudflare Tunnel!
  selector:
    app: cosmos-api
  ports:
    - protocol: TCP
      port: 8090      # 📡 Matches your Cloudflare Tunnel port!
      targetPort: 80  # 📦 Port inside the Pod
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cosmos-api
  namespace: cosmos-app
spec:
  replicas: 2 # 👯‍♂️ High Availability!
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: cosmos-api
  template:
    metadata:
      labels:
        app: cosmos-api
    spec:
      containers:
        - name: api
          image: ghcr.io/sandeepsagarpanjala/cosmos-node-api:latest
          ports:
            - containerPort: 80
          # 🩺 Probes for stability
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
          envFrom:
            - secretRef:
                name: cosmos-secrets # Pulls all secrets at once!
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "300m"
              memory: "512Mi"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cosmos-ingress
  namespace: cosmos-app
  annotations:
    kubernetes.io/ingress.class: "nginx"
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cosmos-api-service
                port:
                  number: 80
