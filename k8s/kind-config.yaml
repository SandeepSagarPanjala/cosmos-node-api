kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    # This tells the "Building" to open its ground-floor windows
    extraPortMappings:
      - containerPort: 80
        hostPort: 80 # Maps your Mac's Port 80
        listenAddress: "127.0.0.1"
      - containerPort: 443
        hostPort: 443 # Maps your Mac's Port 443 (SSL)
        listenAddress: "127.0.0.1"
      - containerPort: 30432 # 👈 Add this for Postgres
        hostPort: 30432
        listenAddress: "127.0.0.1"
