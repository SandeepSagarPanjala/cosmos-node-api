apiVersion: v1
kind: Service
metadata:
  name: cosmos-redis-service # 👈 This matches your .env REDIS_URL
  namespace: cosmos-app
spec:
  selector:
    app: redis
  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cosmos-redis
  namespace: cosmos-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:alpine
          ports:
            - containerPort: 6379
