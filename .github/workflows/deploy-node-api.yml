name: Deploy Cosmos Api (Self Hosted)
run-name: Backend Deploy by @${{ github.actor }} 🚀

on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  # JOB 1: THE FACTORY (Builds the image on GitHub's clean Linux servers)
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Required to build for ARM64 on an Intel GitHub runner
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Required for multi-platform builds
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          push: true
          # This ensures it runs natively on Apple Silicon (M1/M2/M3)
          platforms: linux/arm64
          tags: ghcr.io/sandeepsagarpanjala/cosmos-node-api:latest

  # JOB 2: THE STOREFRONT (Runs on your Mac)
  deploy:
    needs: build-and-push
    runs-on: self-Hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Bulk Inject ALL secrets from your GitHub ENV_FILE secret
      - name: Create and Apply Bulk Secrets
        run: |
          # Create a temp .env from your GitHub Secret
          echo "${{ secrets.ENV_FILE }}" > .env
          
          # 🚀 The Industrial Standard: Turn the whole file into a K8s Secret!
          kubectl create secret generic cosmos-secrets \
            --from-env-file=.env \
            --namespace=cosmos-app \
            --dry-run=client -o yaml | kubectl apply -f -
          
          # Cleanup temp file
          rm .env

      # 2. Apply other manifests
      - name: Apply K8s Manifests
        run: |
          kubectl apply -f k8s/foundation.yaml
          kubectl apply -f k8s/redis.yaml
          kubectl apply -f k8s/postgres.yaml
          kubectl apply -f k8s/api.yaml

      # 2. Zero-Downtime Restart (Pulls the latest image)
      - name: Rolling Update Release
        run: |
          kubectl rollout restart deployment/cosmos-api -n cosmos-app
          kubectl rollout status deployment/cosmos-api -n cosmos-app --timeout=60s

      # 3. Automated Database Migrations inside K8s Pod
      - name: Run K8s Database Migrations
        run: |
          API_POD=$(kubectl get pods -n cosmos-app -l app=cosmos-api -o jsonpath="{.items[0].metadata.name}")
          echo "🚀 Executing migrations on pod: $API_POD"
          kubectl exec -n cosmos-app $API_POD -- pnpm run db:migrate

      # 4. Cleanup
      - name: Cluster Cleanup
        run: |
          kubectl get all -n cosmos-app
