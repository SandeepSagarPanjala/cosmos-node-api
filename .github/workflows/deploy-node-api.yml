name: Deploy Cosmos Api (Self Hosted)
run-name: Backend Deploy by @${{ github.actor }} 🚀

on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  # JOB 1: THE FACTORY (Builds the image on GitHub's clean Linux servers)
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Required to build for ARM64 on an Intel GitHub runner
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Required for multi-platform builds
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          push: true
          # This ensures it runs natively on Apple Silicon (M1/M2/M3)
          platforms: linux/arm64
          tags: ghcr.io/sandeepsagarpanjala/cosmos-api:latest

  # JOB 2: THE STOREFRONT (Runs on your Mac)
  deploy:
    needs: build-and-push
    runs-on: self-Hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Create the .env from your GitHub Secret
      - name: Create .env file
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env
          chmod 600 .env

      # 2. Pull the NATIVE ARM64 image and start it
      - name: Deploy to Docker
        run: |
          docker compose pull
          docker compose up -d

      # 3. Run Database Migrations
      - name: Run Database Migrations
        run: |
          sleep 5 
          docker exec cosmos-api-service pnpm run db:migrate

      # 4. Clean up the disk and remove the secret file trace
      - name: Security & Disk Cleanup
        run: |
          docker image prune -f
          rm .env
